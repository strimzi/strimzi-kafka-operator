---
apiVersion: "kafka.strimzi.io/v1"
kind: "Kafka"
metadata:
  name: "my-cluster"
spec:
  kafka:
    version: "4.2.0"
    metadataVersion: "4.2-IV1"
    listeners:
    - name: "plain"
      port: 9092
      type: "internal"
      tls: false
    - name: "tls"
      port: 9093
      type: "internal"
      tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    template:
      pod:
        nodeSelector:
          example.com/workload: "kafka"
          kubernetes.io/os: "linux"
  entityOperator:
    topicOperator: {}
    userOperator: {}
    template:
      pod:
        nodeSelector:
          example.com/workload: "kafka"
          kubernetes.io/os: "linux"
  cruiseControl:
    template:
      pod:
        nodeSelector:
          example.com/workload: "kafka"
          kubernetes.io/os: "linux"
  kafkaExporter:
    template:
      pod:
        nodeSelector:
          example.com/workload: "kafka"
          kubernetes.io/os: "linux"
