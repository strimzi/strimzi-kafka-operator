    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/strimzi/strimzi-kafka-operator/blob/main/README.md#contributing
    dependency-management-policy: https://github.com/strimzi/strimzi-kafka-operator/blob/main/development-docs/DEV_GUIDE.md#dependency-management
    governance: https://github.com/strimzi/governance/blob/main/GOVERNANCE.md
    review-policy: https://github.com/strimzi/governance/blob/main/GOVERNANCE.md#pr-approval-rules
    security-policy: https://github.com/strimzi/.github/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    changelog: https://github.com/strimzi/strimzi-kafka-operator/blob/main/CHANGELOG.md
    distribution-points:
      - uri: https://github.com/strimzi/strimzi-kafka-operator/releases
        comment: GitHub Releases page with binaries, Kubernetes/OpenShift YAML archives and SBOMs.
      - uri: https://quay.io/repository/strimzi/operator
        comment: Container images, cosign-signed (keyless since 0.49.0).
      - uri: https://central.sonatype.com/namespace/io.strimzi
        comment: Java artifacts published to Maven Central.
      - uri: https://artifacthub.io/packages/search?repo=strimzi-kafka-operator
        comment: Helm charts.
  security:
    assessments:
      self:
        comment: Strimzi has completed a security self-assessment. The assessment document is linked below.
        evidence-url:
          - https://github.com/strimzi/strimzi-kafka-operator/blob/main/SECURITY-SELF-ASSESSMENT.md
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: CodeQL Analysis
            predicate-uri: https://github.com/github/codeql-action
            location: https://github.com/strimzi/strimzi-kafka-operator/actions/workflows/codeql-analysis.yml
      - name: Snyk
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: true
        results:
          ci:
            name: Snyk Scanning
            predicate-uri: https://snyk.io
            location: https://github.com/strimzi/strimzi-kafka-operator/actions/workflows/snyk.yml
      - name: FOSSA
        type: other
        comment: License compliance and dependency scanning.
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: true
        results:
          ci:
            name: FOSSA Scanning
            predicate-uri: https://fossa.com
            location: https://github.com/strimzi/strimzi-kafka-operator/actions/workflows/fossa.yml
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OpenSSF Scorecard Analysis
            predicate-uri: https://github.com/ossf/scorecard-action
            location: https://github.com/strimzi/strimzi-kafka-operator/actions/workflows/scorecards.yml
      - name: OSPS Baseline Scanner
        type: other
        comment: Evaluated against the osps-baseline-2026-08 catalog at Maturity Level 2. Signed results are published to the CNCF-owned strimzi namespace on grc.store.
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
            location: https://grc.store/targets/strimzi/strimzi-kafka-operator
