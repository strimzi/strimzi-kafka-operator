  repositories:
    - name: strimzi-kafka-operator
      url: https://github.com/strimzi/strimzi-kafka-operator
      comment: Primary repository. Runs Apache Kafka on Kubernetes and OpenShift, including the Cluster, Topic and User Operators.
    - name: drain-cleaner
      url: https://github.com/strimzi/drain-cleaner
      comment: Utility to help with draining nodes running Strimzi-managed Apache Kafka or ZooKeeper pods.
    - name: strimzi-kafka-bridge
      url: https://github.com/strimzi/strimzi-kafka-bridge
      comment: HTTP bridge for Apache Kafka.
    - name: strimzi-kafka-oauth
      url: https://github.com/strimzi/strimzi-kafka-oauth
      comment: OAuth2 support for Apache Kafka to work with many OAuth2 authorization servers.
    - name: strimzi-mqtt-bridge
      url: https://github.com/strimzi/strimzi-mqtt-bridge
      comment: MQTT bridge for Apache Kafka.
    - name: kafka-access-operator
      url: https://github.com/strimzi/kafka-access-operator
      comment: Operator for sharing access to Strimzi clusters across namespaces.
    - name: kafka-kubernetes-config-provider
      url: https://github.com/strimzi/kafka-kubernetes-config-provider
      comment: Kubernetes Configuration Provider for Apache Kafka.
    - name: kafka-quotas-plugin
      url: https://github.com/strimzi/kafka-quotas-plugin
      comment: Broker quota plugin for Apache Kafka to allow setting per-broker limits statically in the broker configuration.
    - name: metrics-reporter
      url: https://github.com/strimzi/metrics-reporter
      comment: Prometheus Metrics Reporter for Apache Kafka server and client components.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Strimzi Maintainers
      email: cncf-strimzi-maintainers@lists.cncf.io
      primary: true
    policy: https://github.com/strimzi/.github/blob/main/SECURITY.md
    comment: Report privately via the Strimzi maintainers mailing list. Do not open public GitHub issues for security vulnerabilities.
  documentation:
