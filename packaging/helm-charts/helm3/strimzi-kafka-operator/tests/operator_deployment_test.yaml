suite: strimzi operator deployment
release:
  name: strimzi-test
  namespace: strimzi-test-namespace
templates:
  - 060-Deployment-strimzi-cluster-operator.yaml
tests:
  - it: should have same namespace as release
    set:
      .test: latest
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.namespace
          value: strimzi-test-namespace

  - it: should have take replicas from values
    set:
      replicas: 4
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 4

  - it: should not set revisionHistoryLimit if not provided
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.revisionHistoryLimit

  - it: should set revisionHistoryLimit if provided
    set:
      revisionHistoryLimit: 5
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: should have latest image with default image registry when no image is provided
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: 'quay.io/strimzi/operator:(latest|[0-9]+\.[0-9]+\.[0-9]+)'

  - it: should not set hostUsers by default
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.hostUsers

  - it: should allow override of hostUsers to true
    set:
      hostUsers: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.hostUsers
          value: true

  - it: should not set enableServiceLinks by default
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.enableServiceLinks

  - it: should allow override of enableServiceLinks to false
    set:
      enableServiceLinks: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: should have custom image if details are provided
    set:
      image:
        registry: test.registry.com
        repository: test-repo
        name: tets-operator
        tag: test-tag
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: test.registry.com/test-repo/tets-operator:test-tag

  - it: should set STRIMZI_NAMESPACE to wildcard if watchAnyNamespace is true
    set:
      watchAnyNamespace: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: STRIMZI_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "*"

  - it: should set STRIMZI_NAMESPACE to release namespace if watchAnyNamespace is false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: STRIMZI_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.fieldRef.fieldPath
          value: metadata.namespace

  - it: should set STRIMZI_NAMESPACE to comma separated specified namespaces and deployment namespace if watchNamespaces is specified
    set:
      watchAnyNamespace: false
      watchNamespaces:
        - test-namespace
        - test-namespace2
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: STRIMZI_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "strimzi-test-namespace,test-namespace,test-namespace2"

  - it: should set STRIMZI_NAMESPACE to comma separated specified namespaces and deployment namespace if watchNamespaces is specified and overlapping with release namespace
    set:
      watchAnyNamespace: false
      watchNamespaces:
        - test-namespace
        - test-namespace2
        - strimzi-test-namespace
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: STRIMZI_NAMESPACE
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "strimzi-test-namespace,test-namespace,test-namespace2"

  - it: should construct all kafka images from default image registry if not provided
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: STRIMZI_DEFAULT_KAFKA_EXPORTER_IMAGE
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: STRIMZI_DEFAULT_CRUISE_CONTROL_IMAGE
      - equal:
          path: spec.template.spec.containers[0].env[5].name
          value: STRIMZI_KAFKA_IMAGES
      - equal:
          path: spec.template.spec.containers[0].env[6].name
          value: STRIMZI_KAFKA_CONNECT_IMAGES
      - equal:
          path: spec.template.spec.containers[0].env[7].name
          value: STRIMZI_KAFKA_MIRROR_MAKER_2_IMAGES
      - matchRegex:
          path: spec.template.spec.containers[0].env[3].value
          pattern: 'quay.io/strimzi/kafka:(latest|[0-9]+\.[0-9]+\.[0-9]+)-kafka-[0-9]+\.[0-9]+\.[0-9]+'
      - matchRegex:
          path: spec.template.spec.containers[0].env[4].value
          pattern: 'quay.io/strimzi/kafka:(latest|[0-9]+\.[0-9]+\.[0-9]+)-kafka-[0-9]+\.[0-9]+\.[0-9]+'
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '[0-9]+\.[0-9]+\.[0-9]+=quay.io/strimzi/kafka:latest-kafka-[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '[0-9]+\.[0-9]+\.[0-9]+=quay.io/strimzi/kafka:latest-kafka-[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '[0-9]+\.[0-9]+\.[0-9]+=quay.io/strimzi/kafka:latest-kafka-[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}'

  - it: should construct custom kafka images from specified image registry if provided
    set:
      kafka:
        image:
          registry: test.registry.com
          repository: test-repo
          name: kafka-test
          tagPrefix: test-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[5].name
          value: STRIMZI_KAFKA_IMAGES
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '[0-9]+\.[0-9]+\.[0-9]+=test.registry.com/test-repo/kafka-test:test-tag-kafka-[0-9]+\.[0-9]+\.[0-9]+'

  - it: should set IMAGE_PULL_SECRETS literally if provided as string
    set:
      image:
        imagePullSecrets: test-secret
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-secret
      - equal:
          path: spec.template.spec.containers[0].env[15].name
          value: STRIMZI_IMAGE_PULL_SECRETS
      - equal:
          path: spec.template.spec.containers[0].env[15].value
          value: test-secret

  - it: should set IMAGE_PULL_SECRETS as comma separated list if provided as array
    set:
      image:
        imagePullSecrets:
          - name: test-secret
          - name: test-secret2
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: test-secret
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: test-secret2
      - equal:
          path: spec.template.spec.containers[0].env[15].name
          value: STRIMZI_IMAGE_PULL_SECRETS
      - equal:
          path: spec.template.spec.containers[0].env[15].value
          value: test-secret,test-secret2

  - it: should fail if imagePullSecrets is not correctly formatted
    set:
      image:
        imagePullSecrets:
          - test-secret
          - test-secret2
    asserts:
      - failedTemplate:
          errorMessage: 'executing "strimzi.listPluck" at <.>: wrong type for value; expected map[string]interface {}; got string'

  - it: large numeric values should be properly formatted without scientific notation
    set:
      fullReconciliationIntervalMs: 999999999999
      operationTimeoutMs: 999999999999
      connectBuildTimeoutMs: 999999999999
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: STRIMZI_FULL_RECONCILIATION_INTERVAL_MS
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "999999999999"
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: STRIMZI_OPERATION_TIMEOUT_MS
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "999999999999"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: STRIMZI_CONNECT_BUILD_TIMEOUT_MS
            value: "999999999999"

  - it: should pin each Kafka version independently in image map 5
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '4.2.0=quay.io/strimzi/kafka:latest-kafka-4.2.0@sha256:379ad6201a9a3d6f72d4a69a2d134544f4dbb3c10feb2a6a60e3c52b41ed16cb'
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '4.2.1=quay.io/strimzi/kafka:latest-kafka-4.2.1@sha256:56faef470161bb1b856108c6dfa4f11f53f4ea71104736c9066e1df78f953fad'
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '4.2.2=quay.io/strimzi/kafka:latest-kafka-4.2.2@sha256:b87c118d2a895e362f23da2e2aa55a632941c140f62aa01b25b5ece70ae3bf9d'
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '4.3.0=quay.io/strimzi/kafka:latest-kafka-4.3.0@sha256:5ee2b5814103b6f450ad37c7198e7adb1b9ca820213fdadf930549bcb0c0d961'
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '4.3.1=quay.io/strimzi/kafka:latest-kafka-4.3.1@sha256:7d097c26074d1a3a01f479a8d0bae4835ee433bf55e6cbc5487a68e6bff0667e'

  - it: should pin each Kafka version independently in image map 6
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '4.2.0=quay.io/strimzi/kafka:latest-kafka-4.2.0@sha256:379ad6201a9a3d6f72d4a69a2d134544f4dbb3c10feb2a6a60e3c52b41ed16cb'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '4.2.1=quay.io/strimzi/kafka:latest-kafka-4.2.1@sha256:56faef470161bb1b856108c6dfa4f11f53f4ea71104736c9066e1df78f953fad'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '4.2.2=quay.io/strimzi/kafka:latest-kafka-4.2.2@sha256:b87c118d2a895e362f23da2e2aa55a632941c140f62aa01b25b5ece70ae3bf9d'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '4.3.0=quay.io/strimzi/kafka:latest-kafka-4.3.0@sha256:5ee2b5814103b6f450ad37c7198e7adb1b9ca820213fdadf930549bcb0c0d961'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '4.3.1=quay.io/strimzi/kafka:latest-kafka-4.3.1@sha256:7d097c26074d1a3a01f479a8d0bae4835ee433bf55e6cbc5487a68e6bff0667e'

  - it: should pin each Kafka version independently in image map 7
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '4.2.0=quay.io/strimzi/kafka:latest-kafka-4.2.0@sha256:379ad6201a9a3d6f72d4a69a2d134544f4dbb3c10feb2a6a60e3c52b41ed16cb'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '4.2.1=quay.io/strimzi/kafka:latest-kafka-4.2.1@sha256:56faef470161bb1b856108c6dfa4f11f53f4ea71104736c9066e1df78f953fad'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '4.2.2=quay.io/strimzi/kafka:latest-kafka-4.2.2@sha256:b87c118d2a895e362f23da2e2aa55a632941c140f62aa01b25b5ece70ae3bf9d'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '4.3.0=quay.io/strimzi/kafka:latest-kafka-4.3.0@sha256:5ee2b5814103b6f450ad37c7198e7adb1b9ca820213fdadf930549bcb0c0d961'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '4.3.1=quay.io/strimzi/kafka:latest-kafka-4.3.1@sha256:7d097c26074d1a3a01f479a8d0bae4835ee433bf55e6cbc5487a68e6bff0667e'

  - it: should retain explicit digest and tag overrides
    set:
      kafka.image.digest: sha256:custom
      kafkaConnect.image.tag: custom-tag
      defaultImageTag: custom-release
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: '=quay.io/strimzi/kafka@sha256:custom'
      - matchRegex:
          path: spec.template.spec.containers[0].env[6].value
          pattern: '=quay.io/strimzi/kafka:custom-tag'
      - matchRegex:
          path: spec.template.spec.containers[0].env[7].value
          pattern: '=quay.io/strimzi/kafka:custom-release-kafka-'
