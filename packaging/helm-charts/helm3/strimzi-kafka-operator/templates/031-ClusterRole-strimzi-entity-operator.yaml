{{- $preferNamespaced := and .Values.rbac.preferNamespaced (not .Values.watchAnyNamespace) -}}
{{- if and .Values.rbac.create (or $preferNamespaced .Values.createGlobalResources) -}}
{{- $root := . -}}
{{- $namespaces := list "" -}}
{{- if $preferNamespaced -}}
{{- $namespaces = include "strimzi.watchNamespacesList" . | fromYamlArray -}}
{{- end -}}
{{- range $index, $namespace := $namespaces }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $preferNamespaced }}
metadata:
  name: strimzi-entity-operator
  {{- if $preferNamespaced }}
  namespace: {{ $namespace }}
  {{- end }}
  labels:
    app: {{ template "strimzi.name" $root }}
    chart: {{ template "strimzi.chart" $root }}
    component: entity-operator-role
    release: {{ $root.Release.Name }}
    heritage: {{ $root.Release.Service }}
rules:
- apiGroups:
  - "kafka.strimzi.io"
  resources:
    # The Entity Operator contains the Topic Operator which needs to access and manage KafkaTopic resources
  - kafkatopics
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
  - delete
- apiGroups:
  - "kafka.strimzi.io"
  resources:
    # The Entity Operator contains the User Operator which needs to access and manage KafkaUser resources
  - kafkausers
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - "kafka.strimzi.io"
  resources:
    # The Entity Operator contains the Topic Operator which needs to access and manage KafkaTopic resources
  - kafkatopics/status
    # The Entity Operator contains the User Operator which needs to access and manage KafkaUser resources
  - kafkausers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
    - "kafka.strimzi.io"
  resources:
    # Needed for environments with enabled OwnerReferencesPermissionEnforcement admission controller (e.g. OpenShift)
    - kafkatopics/finalizers
    - kafkausers/finalizers
  verbs:
    - update
- apiGroups:
  - ""
  resources:
    # The entity operator user-operator needs to access and manage secrets to store generated credentials
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - patch
  - update
{{- end }}
{{- end -}}
