spec:
  config:
    goals: "CpuCapacityGoal,NetworkInboundCapacityGoal,DiskCapacityGoal,RackAwareGoal,MinTopicLeadersPerBrokerGoal,NetworkOutboundCapacityGoal,ReplicaCapacityGoal"
