version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: "/docker-images/artifacts/kafka-thirdparty-libs/4.1.x"
    schedule:
      interval: weekly
    labels:
      - dependencies
      -
  - package-ecosystem: maven
    directory: "/docker-images/artifacts/kafka-thirdparty-libs/4.0.x"
