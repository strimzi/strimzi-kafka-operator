      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: "/docker-images/artifacts/kafka-thirdparty-libs/cc"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/docker-images/base"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/docker-images/operator"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: "/docker-images/kafka-based/kafka"
