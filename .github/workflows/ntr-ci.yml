# NTR: build Strimzi images (Kafka URLs from kafka-versions.yaml), push to GHCR, scan with Trivy.
name: NTR CI

on:
  push:
    branches: ["ntr/**"]
    tags: ["ntr/**"]
  pull_request:
    branches: ["ntr/**"]
  workflow_dispatch:

concurrency:
  group: ntr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KAFKA_VERSIONS: "4.0.0 4.1.2"
  JAVA_VERSION: "21"
  MVN_ARGS: "-B -ntp -DskipTests"
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_EXIT_CODE: "1"
  DOCKER_REGISTRY: ghcr.io

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      operator_image: ${{ steps.meta.outputs.operator_image }}
      strimzi_version: ${{ steps.meta.outputs.strimzi_version }}
      docker_org: ${{ steps.meta.outputs.docker_org }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN alone cannot pull a private GHCR package unless that package
      # grants this repository Actions access. Prefer a PAT (read:packages).
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.KAFKA_DIST_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull private base image
        run: |
          set -euo pipefail
          BASE=ghcr.io/${{ github.repository_owner }}/axiom-jdk-alpine-musl:17
          if ! docker pull "$BASE"; then
            echo "::error::Cannot pull ${BASE} (403/404)."
            echo "1) Push locally: ./.github/ntr/push-base-to-ghcr.sh"
            echo "2) Package settings → Manage Actions access → add this repo (Read),"
            echo "   OR make the package public,"
            echo "   OR set secret KAFKA_DIST_TOKEN to a PAT with read:packages."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make shellcheck wget
          # apt "yq" is kislyuk/yq (jq wrapper); use mikefarah/yq for consistent YAML filters
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Configure Maven for GitHub Packages (cruise-control)
        env:
          KAFKA_DIST_TOKEN: ${{ secrets.KAFKA_DIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer a PAT with read:packages if GITHUB_TOKEN cannot read another repo's packages.
          TOKEN="${KAFKA_DIST_TOKEN:-${GITHUB_TOKEN}}"
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>cruise-control</id>
                <username>x-access-token</username>
                <password>${TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Show Kafka download URLs
        run: |
          echo "=== supported Kafka versions (from kafka-versions.yaml) ==="
          yq -o=json \
            '.[] | select(.supported == true) | {"version": .version, "url": .url, "checksum": .checksum, "default": .default}' \
            kafka-versions.yaml

      - name: Build Java and images
        id: meta
        env:
          DOCKER_BUILDKIT: "1"
          # Auth for private GitHub Releases referenced in kafka-versions.yaml
          KAFKA_DIST_TOKEN: ${{ secrets.KAFKA_DIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${KAFKA_DIST_TOKEN:-${GITHUB_TOKEN:-}}"
          STRIMZI_VERSION="$(cat release.version)"
          IMAGE_TAG="${STRIMZI_VERSION}"
          DOCKER_ORG="${{ github.repository_owner }}"
          OPERATOR_IMAGE="strimzi/operator:${IMAGE_TAG}"

          make java_install MVN_ARGS="${{ env.MVN_ARGS }}"
          make -C docker-images/artifacts java_install MVN_ARGS="${{ env.MVN_ARGS }}"
          make -C docker-images/base docker_build \
            RELEASE_VERSION="$STRIMZI_VERSION" \
            BUILD_TAG="$STRIMZI_VERSION" \
            BUILD_ID="${{ github.run_id }}" \
            BUILD_COMMIT="${{ github.sha }}"
          make -C docker-images/operator docker_build \
            RELEASE_VERSION="$STRIMZI_VERSION" \
            DOCKER_TAG="$IMAGE_TAG" \
            BUILD_TAG="$STRIMZI_VERSION" \
            BUILD_ID="${{ github.run_id }}" \
            BUILD_COMMIT="${{ github.sha }}"
          make -C docker-images/kafka-based docker_build \
            RELEASE_VERSION="$STRIMZI_VERSION" \
            DOCKER_TAG="$IMAGE_TAG" \
            BUILD_TAG="$STRIMZI_VERSION" \
            BUILD_ID="${{ github.run_id }}" \
            BUILD_COMMIT="${{ github.sha }}"

          echo "operator_image=${OPERATOR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "strimzi_version=${STRIMZI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docker_org=${DOCKER_ORG}" >> "$GITHUB_OUTPUT"

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          STRIMZI_VERSION="${{ steps.meta.outputs.strimzi_version }}"
          DOCKER_ORG="${{ steps.meta.outputs.docker_org }}"
          export DOCKER_REGISTRY="${{ env.DOCKER_REGISTRY }}"
          export DOCKER_ORG

          make -C docker-images/base docker_push \
            DOCKER_REGISTRY="$DOCKER_REGISTRY" \
            DOCKER_ORG="$DOCKER_ORG" \
            DOCKER_TAG="$STRIMZI_VERSION" \
            BUILD_TAG="$STRIMZI_VERSION"
          make -C docker-images/operator docker_push \
            DOCKER_REGISTRY="$DOCKER_REGISTRY" \
            DOCKER_ORG="$DOCKER_ORG" \
            DOCKER_TAG="$STRIMZI_VERSION" \
            BUILD_TAG="$STRIMZI_VERSION"
          make -C docker-images/kafka-based docker_push \
            DOCKER_REGISTRY="$DOCKER_REGISTRY" \
            DOCKER_ORG="$DOCKER_ORG" \
            DOCKER_TAG="$STRIMZI_VERSION" \
            BUILD_TAG="$STRIMZI_VERSION"

          echo "Pushed:"
          echo "  ${DOCKER_REGISTRY}/${DOCKER_ORG}/operator:${STRIMZI_VERSION}"
          for v in ${{ env.KAFKA_VERSIONS }}; do
            echo "  ${DOCKER_REGISTRY}/${DOCKER_ORG}/kafka:${STRIMZI_VERSION}-kafka-${v}"
          done

      - name: Save images
        run: |
          set -euo pipefail
          mkdir -p images
          STRIMZI_VERSION="${{ steps.meta.outputs.strimzi_version }}"
          docker save -o "images/operator-${STRIMZI_VERSION}.tar" \
            "${{ steps.meta.outputs.operator_image }}"
          for v in ${{ env.KAFKA_VERSIONS }}; do
            docker save -o "images/kafka-${v}.tar" \
              "strimzi/kafka:${STRIMZI_VERSION}-kafka-${v}"
          done

      - name: Upload image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: strimzi-images
          path: images/
          if-no-files-found: error

  scan:
    name: Trivy scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: strimzi-images
          path: images

      - name: Load images
        run: |
          set -euo pipefail
          for f in images/*.tar; do
            docker load -i "$f"
          done
          docker images

      - name: Install Trivy
        run: |
          set -euo pipefail
          # Pin to a release that still exists on GitHub (older tags are pruned).
          VER=0.76.0
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${VER}/trivy_${VER}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tgz
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy scan images
        run: |
          set -euo pipefail
          scan_status=0
          OPERATOR_IMAGE="${{ needs.build.outputs.operator_image }}"
          STRIMZI_VERSION="${{ needs.build.outputs.strimzi_version }}"

          echo "=== Trivy ${OPERATOR_IMAGE} ==="
          trivy image --no-progress --severity "${{ env.TRIVY_SEVERITY }}" \
            --exit-code "${{ env.TRIVY_EXIT_CODE }}" \
            --format json --output trivy-operator.json "$OPERATOR_IMAGE" || scan_status=$?
          trivy image --no-progress --severity "${{ env.TRIVY_SEVERITY }}" \
            --format table "$OPERATOR_IMAGE" || true

          for v in ${{ env.KAFKA_VERSIONS }}; do
            img="strimzi/kafka:${STRIMZI_VERSION}-kafka-${v}"
            echo "=== Trivy ${img} ==="
            trivy image --no-progress --severity "${{ env.TRIVY_SEVERITY }}" \
              --exit-code "${{ env.TRIVY_EXIT_CODE }}" \
              --format json --output "trivy-kafka-${v}.json" "$img" || scan_status=$?
            trivy image --no-progress --severity "${{ env.TRIVY_SEVERITY }}" \
              --format table "$img" || true
          done
          exit "$scan_status"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-strimzi
          path: |
            trivy-operator.json
            trivy-kafka-*.json
