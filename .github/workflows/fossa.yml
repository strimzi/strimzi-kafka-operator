name: FOSSA Scanning

on:
  # Run after build workflow finishes in non-blocking way
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - main
    # `branches` matches the triggering run's head branch by name only. A fork PR
    # whose branch is also named "main" matches it, and workflow_run jobs get the
    # org secrets regardless of who produced the build. Every job below therefore
    # also checks head_repository before touching the build artifact.
  # Allow to run it also as reusable workflow from releases
  workflow_call:
    inputs:
      releaseVersion:
        description: 'Release version for FOSSA branch reference'
        required: false
        type: string
        default: ''
      sourceBuildRunId:
        description: 'Build workflow run ID for artifact download'
        required: true
        type: string
    secrets:
      FOSSA_API_KEY:
        required: true

# Declare default permissions as read only
permissions:
  contents: read

# Cancel previous scans on the same branch
concurrency:
  group: fossa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scan Maven dependencies using FOSSA
  fossa-maven-scan:
    name: FOSSA Maven Scan
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: strimzi/github-actions/.github/actions/dependencies/setup-java@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          javaVersion: "21"

      - name: Install yq
        uses: strimzi/github-actions/.github/actions/dependencies/install-yq@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          version: "v4.6.3"

      - name: Build Java code
        run: mvn -B -DskipTests -Dmaven.javadoc.skip=true clean install

      - name: Run FOSSA Maven scan
        uses: strimzi/github-actions/.github/actions/security/fossa-maven-scan@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          scanName: operators
          fossaTest: "true"
          branch: ${{ github.ref_name }}

  # Discover container images from build artifacts for matrix scanning
  prepare-container-scan:
    name: Prepare Container Scan
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      images: ${{ steps.list-images.outputs.images }}
    steps:
      - name: Download container archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: containers-operators-amd64.tar
          run-id: ${{ inputs.sourceBuildRunId || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Untar container archive
        run: tar -xvf containers-operators-amd64.tar

      - name: List container images
        id: list-images
        run: |
          # Names come from filenames inside the downloaded artifact and flow on into
          # shell and action inputs, so restrict them to a safe charset here.
          IMAGES=$(find docker-images/container-archives -name '*.tar.gz' ! -name 'base-*' -print0 | \
            xargs -0 -I{} basename {} | \
            sed 's/\.tar\.gz$//' | \
            jq -R -s -c 'split("\n") | map(select(test("^[A-Za-z0-9._-]+$")))')
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Found images: $IMAGES"

  # Scan each container image using FOSSA
  fossa-container-scan:
    name: FOSSA Container Scan (${{ matrix.image }})
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    needs:
      - prepare-container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      CONTAINERS_ARCHIVE: "containers-operators-amd64.tar"
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare-container-scan.outputs.images) }}
    steps:
      - name: Download container archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.CONTAINERS_ARCHIVE }}
          run-id: ${{ inputs.sourceBuildRunId || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Untar container archive
        run: tar -xvf "$CONTAINERS_ARCHIVE"

      - name: Install Docker
        uses: strimzi/github-actions/.github/actions/dependencies/install-docker@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0

      - name: Derive FOSSA scan name
        id: scan-name
        # Derive a clean FOSSA project name from the archive filename.
        # Examples: operator-latest-amd64 -> operator-container
        #           kafka-latest-kafka-4.2.0-amd64 -> kafka-4.2.0-container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          name="$IMAGE"
          name="${name//-latest/}"        # strip "-latest" tag
          name="${name//-amd64/}"         # strip "-amd64" architecture suffix
          name="${name/#kafka-kafka-/kafka-}"  # deduplicate "kafka-kafka-" prefix
          name="${name}-container"        # append "-container" to distinguish from Maven project
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Run FOSSA container scan
        uses: strimzi/github-actions/.github/actions/security/fossa-container-scan@8a88edc07beb03fbd99d6d72f59c86d7d7aadda4 # v3.0
        with:
          imageFile: docker-images/container-archives/${{ matrix.image }}.tar.gz
          image: ${{ matrix.image }}
          scanName: ${{ steps.scan-name.outputs.name }}
          fossaTest: "true"
          branch: ${{ inputs.releaseVersion || github.ref_name }}