workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - scan

variables:
  KAFKA_VERSION: "4.3.0"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MVN_ARGS: "-B -ntp -DskipTests"
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_EXIT_CODE: "1"

.docker_build:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  cache:
    key: maven
    paths:
      - .m2/repository
  before_script:
    - apk add --no-cache bash coreutils curl findutils git gzip make maven openjdk21 shellcheck tar unzip yq zip
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:strimzi-kafka-images:
  extends: .docker_build
  stage: build
  script:
    - export STRIMZI_VERSION="$(cat release.version)"
    - export IMAGE_TAG="${STRIMZI_VERSION}"
    - cp ".gitlab/ci/kafka-versions-${KAFKA_VERSION}.yaml" kafka-versions.yaml
    - make java_install MVN_ARGS="$MVN_ARGS"
    - make -C docker-images/base docker_build RELEASE_VERSION="$STRIMZI_VERSION" BUILD_TAG=$STRIMZI_VERSION" BUILD_ID="$CI_PIPELINE_ID" BUILD_COMMIT="$CI_COMMIT_SHA"
    - make -C docker-images/operator docker_build docker_push RELEASE_VERSION="$STRIMZI_VERSION" DOCKER_REGISTRY="$CI_REGISTRY" DOCKER_ORG="$CI_PROJECT_PATH" DOCKER_TAG="$IMAGE_TAG" BUILD_TAG="$STRIMZI_VERSION" BUILD_ID="$CI_PIPELINE_ID" BUILD_COMMIT="$CI_COMMIT_SHA"
    - make -C docker-images/kafka-based docker_build docker_push RELEASE_VERSION="$STRIMZI_VERSION" DOCKER_REGISTRY="$CI_REGISTRY" DOCKER_ORG="$CI_PROJECT_PATH" DOCKER_TAG="$IMAGE_TAG" BUILD_ID="$CI_PIPELINE_ID" BUILD_COMMIT="$CI_COMMIT_SHA"
    - echo "STRIMZI_OPERATOR_IMAGE=${CI_REGISTRY_IMAGE}/operator:${IMAGE_TAG}" > image.env
    - echo "STRIMZI_KAFKA_IMAGE=${CI_REGISTRY_IMAGE}/kafka:${IMAGE_TAG}-kafka-${KAFKA_VERSION}" >> image.env
  artifacts:
    reports:
      dotenv: image.env

scan:trivy:
  image:
    name: aquasec/trivy:0.54.1
    entrypoint: [""]
  stage: scan
  needs:
    - job: build:strimzi-kafka-images
      artifacts: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  cache:
    key: trivy
    paths:
      - .trivycache
  script:
    - scan_status=0
    - trivy image --no-progress --severity "$TRIVY_SEVERITY" --exit-code "$TRIVY_EXIT_CODE" --format json --output trivy-operator.json "$STRIMZI_OPERATOR_IMAGE" || scan_status=$?
    - trivy image --no-progress --severity "$TRIVY_SEVERITY" --exit-code "$TRIVY_EXIT_CODE" --format json --output trivy-kafka.json "$STRIMZI_KAFKA_IMAGE" || scan_status=$?
    - trivy image --no-progress --severity "$TRIVY_SEVERITY" --format table "$STRIMZI_OPERATOR_IMAGE"
    - trivy image --no-progress --severity "$TRIVY_SEVERITY" --format table "$STRIMZI_KAFKA_IMAGE"
    - exit "$scan_status"
  artifacts:
    when: always
    paths:
      - trivy-operator.json
      - trivy-kafka.json
